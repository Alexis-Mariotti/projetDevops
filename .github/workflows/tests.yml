name: Tests - Intégration Continue

on:
  push:
    branches: [ main, develop, features/* ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.8', '3.9', '3.10', '3.11']

    steps:
    - uses: actions/checkout@v3

    - name: Definition de la version Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Installation des dépendances
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # linter flake8, peut etre uttilisé mais pas nescessaire car pas vu en cours
    #- name: Vérification avec flake8
    #  run: |
    #    pip install flake8
    #    # Arrêter la compilation sur les erreurs de syntaxe
    #    flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
    #    # exit-zero traite tous les erreurs comme des avertissements
    #    flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    #  continue-on-error: true

    - name: Exécution des tests avec pytest
      run: |
        pytest -v --cov=. --cov-report=xml --cov-report=html

    - name: Upload coverage reports
      uses: codecov/codecov-action@v3
      if: always()
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella

